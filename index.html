<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackCatHacks - Photo Leak Checker</title>
<style>
body{background:#0a0a0a;color:#00ff41;font-family:monospace;padding:20px;text-align:center}
.box{border:1px solid #00ff41;padding:20px;max-width:600px;margin:auto;border-radius:10px;background:#111}
input{margin:20px 0}
#result{text-align:left;white-space:pre-wrap;background:#000;padding:15px;margin-top:20px;border-radius:5px;min-height:100px}
h1{color:#fff}.red{color:red}.green{color:#00ff41}
</style>
</head>
<body>
<h1>😺 BlackCatHacks.in</h1>
<h2>Photo Leak Checker</h2>
<div class="box">
<p>Check if your photo leaks Location / Device Info</p>
<input type="file" id="file" accept="image/*">
<div id="result">Koi photo select karo... Result yahan aayega</div>
<p style="font-size:12px;color:#888;margin-top:20px">100% Private - Photo kahin upload nahi hota, sab kuch aapke phone me hi check hota hai</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<script>
document.getElementById('file').addEventListener('change', function(e){
 let file = e.target.files[0];
 if(!file) return;
 let res = document.getElementById('result');
 res.innerHTML = "Scanning...";
 EXIF.getData(file, function(){
   let all = EXIF.getAllTags(this);
   console.log(all);
   if(Object.keys(all).length==0){
     res.innerHTML = "<span class='green'>✅ SAFE - Is photo me koi location data nahi hai</span>\n\nAapki photo safe hai share karne ke liye.";
   } else {
     let out = "<span class='red'>⚠️ WARNING - Is photo me data mila!</span>\n\n";
     if(all.GPSLatitude) out += "📍 GPS Location: MILA - Isse aapki location leak ho sakti hai!\nLat: "+all.GPSLatitude+"\nLon: "+all.GPSLongitude+"\n\n";
     else out += "📍 GPS Location: Nahi mila (Safe)\n\n";
     if(all.Make) out += "📱 Phone: "+all.Make+" "+(all.Model||"")+"\n";
     if(all.DateTime) out += "📅 Date: "+all.DateTime+"\n";
     if(all.Software) out += "Software: "+all.Software+"\n";
     out += "\n--- Full Data ---\n"+JSON.stringify(all,null,2);
     res.innerHTML = out;
   }
 });
});
</script>
</body>
</html>
