<!DOCTYPE html>
<html lang="en">

<style>

.result{margin-top:10px;background:#000;border:1px solid #333;padding:8px;word-break:break-all;min-height:20px;color:#0ff}
a{color:#0f0}
</style>

<button id="btnCyber">Cybercrime Portal</button>

</div>

<div class="tool-box">
<h3>📧 Email Investigation</h3>

<button onclick="investigateEmail()">Investigate</button>

</div>

<div class="tool-box">
<h3>🌐 IP & My Info</h3>

<div id="ipResult" class="result"></div>
</div>
