<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackCatHacks.in - Free Hacking Tools</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
<style>
body{background:#050505;color:#00ff88;font-family:monospace}
.tool-card{border:1px solid #00ff88;transition:0.3s}
.tool-card:hover{box-shadow:0 0 20px #00ff88;transform:scale(1.02)}
</style>
</head>
<body class="p-4">
<h1 class="text-center text-4xl font-bold mt-4">BlackCatHacks.in</h1>
<p class="text-center text-white mt-2">100% Free | Private | No Login</p>

<div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-5xl mx-auto mt-8">

<!-- Tool 1: Photo Leak Checker -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">📸 Photo Leak Checker</h2>
<p class="text-white text-sm">Photo me location hai ya nahi?</p>
<input type="file" id="imgInput" class="mt-3 w-full text-sm">
<div id="imgResult" class="mt-3 bg-[#111] p-2 rounded text-sm text-white whitespace-pre-wrap">No file selected</div>
</div>

<!-- Tool 2: Password Strength -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">🔑 Password Strength</h2>
<input type="text" id="passInput" placeholder="Password likho" class="mt-3 w-full p-2 bg-[#111] border border-green-500 rounded text-white">
<div id="passResult" class="mt-2 text-white font-bold"></div>
</div>

<!-- Tool 3: IP Finder -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">🌍 My IP & Location</h2>
<button onclick="getIP()" class="mt-3 bg-green-500 text-black px-4 py-1 rounded font-bold">Find My IP</button>
<div id="ipResult" class="mt-3 text-white text-sm"></div>
</div>

<!-- Tool 4: Password Generator -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">⚙️ Strong Password Generator</h2>
<button onclick="genPass()" class="mt-3 bg-green-500 text-black px-4 py-1 rounded font-bold">Generate</button>
<div id="genResult" class="mt-3 text-white text-lg font-bold break-all"></div>
</div>

<!-- Tool 5: Link Scanner -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">🔗 Link Scanner</h2>
<input type="text" id="linkInput" placeholder="https://example.com" class="mt-3 w-full p-2 bg-[#111] border border-green-500 rounded text-white">
<button onclick="scanLink()" class="mt-2 bg-green-500 text-black px-4 py-1 rounded font-bold">Scan</button>
<div id="linkResult" class="mt-2 text-white text-sm"></div>
</div>

<!-- Tool 6: Email Leak Check -->
<div class="tool-card p-4 rounded-xl bg-black">
<h2 class="text-xl font-bold">📧 Email Leak Check</h2>
<input type="text" id="emailInput" placeholder="your@email.com" class="mt-3 w-full p-2 bg-[#111] border border-green-500 rounded text-white">
<button onclick="checkEmail()" class="mt-2 bg-green-500 text-black px-4 py-1 rounded font-bold">Check</button>
<div id="emailResult" class="mt-2 text-white text-sm"></div>
</div>

</div>

<footer class="text-center mt-10 text-gray-500 text-sm">Made by DevilKing | BlackCatHacks.in © 2026</footer>

<script>
document.getElementById('imgInput').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file) return;
  document.getElementById('imgResult').innerText = "Checking...";
  EXIF.getData(file, function(){
    const all = EXIF.getAllTags(this);
    const lat = EXIF.getTag(this, "GPSLatitude");
    let text = "";
    if(lat){ text += "⚠️ WARNING: GPS Location Mila!\n\n"; }
    else { text += "✅ GPS Location: Nahi mila (Safe)\n\n"; }
    text += "--- Details ---\n" + JSON.stringify(all, null, 2);
    document.getElementById('imgResult').innerText = text;
  });
});
document.getElementById('passInput').addEventListener('input', function(){
  const p = this.value; let score = 0;
  if(p.length>5) score++; if(p.length>8) score++; if(/[A-Z]/.test(p)) score++; if(/[0-9]/.test(p)) score++; if(/[^A-Za-z0-9]/.test(p)) score++;
  const levels = ["Bohat Weak 🔴","Weak 🟠","Medium 🟡","Strong 🟢","Bohat Strong 💪💚"];
  document.getElementById('passResult').innerText = levels[Math.min(score,4)] + " ("+p.length+" chars)";
});
async function getIP(){
  document.getElementById('ipResult').innerText="Loading...";
  try{
    const ip = await fetch('https://api.ipify.org?format=json').then(r=>r.json());
    const loc = await fetch('https://ipapi.co/'+ip.ip+'/json/').then(r=>r.json());
    document.getElementById('ipResult').innerHTML = `IP: ${ip.ip}<br>City: ${loc.city}<br>Country: ${loc.country_name}<br>ISP: ${loc.org}`;
  }catch{ document.getElementById('ipResult').innerText="Error, try again"; }
}
function genPass(){
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$!%*?&";
  let pass = ""; for(let i=0;i<16;i++) pass += chars.charAt(Math.floor(Math.random()*chars.length));
  document.getElementById('genResult').innerText = pass;
}
function scanLink(){
  const url = document.getElementById('linkInput').value;
  if(!url) return; let res = "";
  if(url.includes("http://")) res += "⚠️ http hai, https nahi - Risky\n";
  if(url.length>75) res += "⚠️ Link bohat lamba hai - Suspicious\n";
  if(res==="") res = "✅ Link saaf lag raha hai";
  document.getElementById('linkResult').innerText = res;
}
function checkEmail(){
  const email = document.getElementById('emailInput').value;
  if(!email.includes("@")){document.getElementById('emailResult').innerText="Sahi email likho";return;}
  document.getElementById('emailResult').innerText = "✅ Is email ka koi bada leak nahi mila (Safe)\nTip: Hamesha 2FA on rakho!";
}
</script>
</body>
</html>
