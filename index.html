<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlackCatHacks.in</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#00ff00">
<style>
body{margin:0;background:#000;color:#0f0;overflow:hidden;font-family:monospace}
canvas{position:fixed;top:0;left:0;z-index:-1}
#content{position:relative;z-index:1;padding:20px;text-align:center;min-height:100vh}
button{background:#000;border:1px solid #0f0;color:#0f0;padding:10px 18px;cursor:pointer;margin:6px}
button:hover{background:#0f0;color:#000}
#policeResult{margin-top:20px;word-break:break-all}
</style>
</head>
<body>
<canvas id="matrix"></canvas>
<div id="content">
<h1>BlackCatHacks.in</h1>
<p>Ethical Hacking Tools</p>
<div id="policeResult">Location will appear here</div>
<br>
<button id="btnSms">Open SMS 112</button>
<button id="btnCyber">Cybercrime Portal</button>
<button id="btnCall">Call 112</button>
</div>

<script>
let mapLink = window.location.href;
let msg = "Emergency Help Needed at: " + mapLink;

document.getElementById('policeResult').innerText = "Location: "+mapLink+"\nReady to report.";

document.getElementById('btnSms').onclick = ()=>{
  window.open(`sms:112?body=${encodeURIComponent(msg)}`, '_blank');
};
document.getElementById('btnCyber').onclick = ()=>{
  window.open("https://cybercrime.gov.in","_blank");
};
document.getElementById('btnCall').onclick = ()=>{
  if(confirm("Are you sure you want to CALL 112?")) {
    window.location.href="tel:112";
  }
};
</script>

<script>
// ===== MULTI-COLOR HACKER RAIN - FINAL FIXED =====
const c=document.getElementById('matrix'),x=c.getContext('2d');
c.width=window.innerWidth;c.height=window.innerHeight;
const chars="01BLACKCAT@#$%&*<>".split("");
const colors=["#00ff00","#00ffff","#ff0000","#ffff00","#ff00ff","#0080ff","#ffffff"];
const drops=[];
for(let i=0;i<c.width/14;i++)drops[i]={y:Math.random()*c.height/14, color:colors[Math.floor(Math.random()*colors.length)]};
function draw(){
  x.fillStyle='rgba(0,0,0,0.08)';x.fillRect(0,0,c.width,c.height);
  x.font='14px monospace';
  drops.forEach((d,i)=>{
    if(Math.random()>0.98) d.color=colors[Math.floor(Math.random()*colors.length)];
    x.fillStyle=d.color;x.shadowColor=d.color;x.shadowBlur=10;
    x.fillText(chars[Math.floor(Math.random()*chars.length)],i*14,d.y*14);
    x.shadowBlur=0;
    if(d.y*14>c.height && Math.random()>0.975){d.y=0;d.color=colors[Math.floor(Math.random()*colors.length)];}
    d.y++;
  });
}
setInterval(draw,35);
window.addEventListener('resize',()=>{c.width=innerWidth;c.height=innerHeight});
</script>
</body>
</html>
