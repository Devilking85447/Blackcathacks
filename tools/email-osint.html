<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RedEyeLab Email OSINT</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/blueimp-md5/2.19.0/js/md5.min.js"></script>
<style>
body{
  background:#000;
  color:#00ff41;
  font-family:monospace;
  padding:15px;
  margin:0;
  position:relative;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed;
  top:0; left:0; right:0; bottom:0;
  background: url('logo.png') no-repeat center center;
  background-size: 450px;
  opacity:0.12;
  filter: drop-shadow(0 0 20px red);
  z-index:-1;
}
.box{max-width:650px;margin:30px auto;border:1px solid #ff0000;padding:20px;text-align:center;background:rgba(10,10,10,0.85);box-shadow:0 0 25px #ff000030;backdrop-filter:blur(3px)}
.logo{width:100px;height:100px;border-radius:50%;border:2px solid #ff0000;box-shadow:0 0 20px #ff0000;object-fit:cover}
input{width:95%;padding:12px;background:#111;color:#fff;border:1px solid #00ff41;text-align:left;margin-top:10px}
button{width:98%;padding:12px;margin-top:10px;background:#ff0000;color:#fff;font-weight:bold;cursor:pointer;border:none;letter-spacing:2px;box-shadow:0 0 10px #ff0000}
button:hover{background:#cc0000}
.card{background:#111;padding:12px;margin-top:15px;display:none;border-left:3px solid red;text-align:left}
a{color:#29b6f6}
h2 span{color:#ff0000;text-shadow:0 0 10px red}
</style>
</head>
<body>
<div class="box">
<img src="logo.png" class="logo" alt="RedEyeLab" onerror="this.src='https://i.imgur.com/8Km9tLL.png'">
<h2>👁️ <span>RedEyeLab</span></h2>
<h3 style="margin-top:-15px">Email OSINT Tool</h3>
<p style="color:#888;font-size:12px">BlackCatHacks | For Educational Purpose Only</p>

<input id="email" type="email" placeholder="target@gmail.com">
<button onclick="run()">[ INVESTIGATE ]</button>
<div id="out" class="card"></div>
</div>

<script>
function run(){
let e=document.getElementById('email').value.trim().toLowerCase();
if(!e){alert("Enter email");return}
let hash=md5(e);
let gravatar=`https://www.gravatar.com/avatar/${hash}?d=404&s=200`;
let out=document.getElementById('out');
out.style.display='block';
out.innerHTML=`
<h3 style="color:#ff0000">${e}</h3>
<img src="${gravatar}" onerror="this.style.display='none'" width="70" style="border-radius:50%;border:2px solid red"><br><br>
<b>Gravatar:</b> <a href="https://en.gravatar.com/site/check/${e}" target="_blank">Check Photo</a><br>
<b>Epieos:</b> <a href="https://epieos.com/?q=${e}" target="_blank">Full Report</a><br>
<b>HIBP:</b> <a href="https://haveibeenpwned.com/account/${e}" target="_blank">Breach Check</a><br>
<b>Google Dork:</b> <a href="https://www.google.com/search?q=%22${e}%22" target="_blank">Search</a><br>
`;
}
</script>
</body>
</html>
