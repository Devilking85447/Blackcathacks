<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS Link Generator</title>
</head>
<body style="background:#000;color:#fff;font-family:Arial;text-align:center;padding:30px 15px">
<h2 style="color:#ff3333">🚨 Emergency SOS - Create Link</h2>
<p style="opacity:.6;font-size:13px">Create a secret link for your family safety</p>

<input id="c" placeholder="Ex: n89nx" style="padding:12px;width:90%;max-width:300px;background:#111;border:1px solid #333;color:#fff;border-radius:8px;text-align:center">
<br><br>
<button onclick="make()" style="background:#00ff88;color:#000;padding:12px 25px;border:none;border-radius:25px;font-weight:bold;font-size:15px">Generate SOS Link</button>

<p id="o" style="margin-top:25px;word-break:break-all;font-size:14px"></p>

<script>
function make(){
let code=document.getElementById('c').value.trim();
if(!code){code='n89nx';}
let link=`https://devilking85447.github.io/Blackcathacks/?sos=${code}`;
document.getElementById('o').innerHTML=`Your SOS Link:<br><br><a style="color:#00ff88" href="${link}" target="_blank">${link}</a><br><br><a href="https://wa.me/?text=${encodeURIComponent('🚨 Emergency Link: '+link)}" target="_blank"><button style="background:#25D366;color:#fff;padding:10px 20px;border:none;border-radius:20px;font-weight:bold">Share on WhatsApp</button></a>`;
}
</script>
</body>
</html>
