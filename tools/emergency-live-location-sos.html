<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Emergency SOS - Family Safety</title>
<style>
body{background:#000;color:#fff;font-family:Arial;margin:0;padding:20px;text-align:center}
.card{background:#0a120a;border:1px solid #ff3333;border-radius:15px;padding:20px;max-width:380px;margin:30px auto}
button{width:100%;padding:14px;margin:8px 0;border-radius:25px;border:none;font-weight:bold;font-size:14px;cursor:pointer}
#locBtn{background:#ff3333;color:#fff}
#photoBtn{background:#3366ff;color:#fff}
#audioBtn{background:#00aa55;color:#fff}
#sendBtn{background:#00ff88;color:#000;display:none}
video{width:100%;border-radius:10px;display:none;margin-top:10px}
.status{font-size:12px;opacity:.8;min-height:16px}
small{opacity:.4;font-size:10px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:40px">🚨</div>
<h2 style="color:#ff3333">Family Emergency SOS</h2>
<p style="font-size:12px;opacity:.7">Har step aap khud allow karoge - koi hidden capture nahi</p>

<button id="locBtn" onclick="getLoc()">Step 1: 📍 Location Share</button>
<div id="locS" class="status">Pending</div>

<button id="photoBtn" onclick="getPhoto()">Step 2: 📸 Apni Photo Lo</button>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas" style="display:none"></canvas>
<div id="photoS" class="status">Pending</div>

<button id="audioBtn" onclick="getAudio()">Step 3: 🎤 30 Sec Voice</button>
<div id="audioS" class="status">Pending</div>

<button id="sendBtn" onclick="sendSOS()">Step 4: ✅ Family ko Bhejo</button>
<div id="final" style="margin-top:15px"></div>
<br><small>BlackCatHacks.in - Safe SOS Tool</small>
</div>

<script>
let locLink="", photoData="", audioBlob=null;

function getLoc(){
 document.getElementById('locS').innerText="Allow kar rahe hai...";
 navigator.geolocation.getCurrentPosition(pos=>{
  locLink=`https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
  document.getElementById('locS').innerText="✅ Location mil gayi: "+pos.coords.latitude.toFixed(4);
  checkAll();
 },()=>{ document.getElementById('locS').innerText="❌ Please Allow Location"; });
}

async function getPhoto(){
 try{
  let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"}});
  let video=document.getElementById('video'); video.style.display='block'; video.srcObject=stream;
  document.getElementById('photoS').innerText="Camera on... 2 sec me photo lega";
  await new Promise(r=>setTimeout(r,2000));
  let canvas=document.getElementById('canvas'); canvas.width=video.videoWidth; canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0);
  photoData=canvas.toDataURL('image/jpeg',0.5);
  stream.getTracks().forEach(t=>t.stop()); video.style.display='none';
  document.getElementById('photoS').innerText="✅ Photo done";
  checkAll();
 }catch(e){ document.getElementById('photoS').innerText="❌ Camera Allow karo: "+e.message; }
}

async function getAudio(){
 try{
  let stream=await navigator.mediaDevices.getUserMedia({audio:true});
  let recorder=new MediaRecorder(stream); let chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{ audioBlob=new Blob(chunks,{type:'audio/webm'}); document.getElementById('audioS').innerText="✅ Audio Recorded: "+(audioBlob.size/1024).toFixed(0)+"KB"; stream.getTracks().forEach(t=>t.stop()); checkAll(); };
  recorder.start();
  document.getElementById('audioS').innerText="🔴 Recording 30 Sec... Zor se bolo!";
  setTimeout(()=>recorder.stop(),30000);
 }catch(e){ document.getElementById('audioS').innerText="❌ Mic Allow karo: "+e.message; }
}

function checkAll(){ if(locLink && photoData && audioBlob){ document.getElementById('sendBtn').style.display='block'; } }

function sendSOS(){
 let msg=`🚨 EMERGENCY SOS 🚨\nMeri Location: ${locLink}\nTime: ${new Date().toLocaleString()}\nPhoto + Audio is saath me hai.`;
 let wa=`https://wa.me/?text=${encodeURIComponent(msg)}`;
 document.getElementById('final').innerHTML=`<b style="color:#00ff88">✅ SOS Ready!</b><br><a href="${locLink}" target="_blank" style="color:#00ff88;word-break:break-all">${locLink}</a><br><br><a href="${wa}" target="_blank"><button style="background:#25D366;color:#fff;padding:12px 20px;border-radius:25px">WhatsApp pe Share Karo</button></a><br><br><small>Photo & Audio aapke phone me hai, WhatsApp pe manually attach kar dena</small>`;
}
</script>
</body>
</html>
