name: BlackCatHacks Daily Team

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  daily-work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: 1. Protector - Scan Site
        run: |
          echo "🛡️ PROTECTOR STARTED"
          if [ -f "protector.js" ]; then
            node protector.js
          else
            echo "protector.js not found, skipping"
          fi

      - name: 2. Ranker - Find Money Keywords
        run: |
          echo "📈 RANKER STARTED"
          if [ -f "ranker.js" ]; then
            node ranker.js
          else
            echo "ranker.js not found, skipping"
          fi

      - name: 3. Builder - Build New Tool
        run: |
          echo "🛠️ BUILDER STARTED"
          if [ -f "builder.js" ]; then
            node builder.js
          else
            echo "builder.js not found, skipping"
          fi

      - name: 4. Writer - Write SEO Blog
        run: |
          echo "✍️ WRITER STARTED"
          if [ -f "writer.js" ]; then
            node writer.js
          else
            echo "writer.js not found, skipping"
          fi

      - name: 5. Commit All New Work
        run: |
          git config --global user.name "BlackCatHacks Bot"
          git config --global user.email "bot@blackcathacks.com"
          git add -A
          git diff --staged --quiet || git commit -m "Daily Auto Work: $(date +'%Y-%m-%d')"
          git push || echo "Nothing to push"

      - name: Done
        run: echo "🎉 ALL WORKERS FINISHED"
