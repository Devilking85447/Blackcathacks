name: BlackCatHacks Daily Team

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  daily-work:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1. Protector - Scan Site
        run: |
          echo "🛡️ PROTECTOR STARTED"
          if [ -f "protector.js" ]; then
            node protector.js || echo "Protector error but continuing"
          else
            echo "protector.js not found, skipping"
          fi

      - name: 2. Ranker - Find Keywords
        run: |
          echo "📈 RANKER STARTED"
          if [ -f "ranker.js" ]; then
            node ranker.js || echo "Ranker error but continuing"
          else
            echo "ranker.js not found, skipping"
          fi

      - name: 3. Builder - Build New Tool
        run: |
          echo "🛠️ BUILDER STARTED"
          if [ -f "builder.js" ]; then
            node builder.js || echo "Builder error but continuing"
          else
            echo "builder.js not found, skipping"
          fi

      - name: 4. Writer - Write Blog
        run: |
          echo "✍️ WRITER STARTED"
          if [ -f "writer.js" ]; then
            node writer.js || echo "Writer error but continuing"
          else
            echo "writer.js not found, skipping"
          fi

      - name: 5. Update Index - Add New Tools to Homepage
        run: |
          echo "🔄 INDEX UPDATER STARTED"
          if [ -f "index-updater.js" ]; then
            node index-updater.js || echo "Updater error but continuing"
          else
            echo "index-updater.js not found, skipping"
          fi

      - name: 6. Commit All New Work
        run: |
          git config --global user.name "BlackCatHacks Bot"
          git config --global user.email "bot@blackcathacks.com"
          git add -A || true
          git diff --staged --quiet || git commit -m "Daily Auto Work: $(date +'%Y-%m-%d')" || true
          git push || echo "Nothing to push"

      - name: Done
        run: echo "🎉 WORK DONE - INDEX UPDATED"
